name: ci

# Vet + build + test on every push to the main branches and on pull requests, so
# the release tag is never the first time the code is exercised in CI.
on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  vet-and-test:
    name: vet, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
